# Profile active when rendering solution handouts
project:
  output-dir: _site/solution

website:
  navbar:
    right:
      - href: ../index.html
        text: Go to student version
        icon: book

  announcement:
    icon: info-circle
    dismissable: false
    content: "You are viewing the solution version of the course notes. Click the button in the top right to switch to the student version."
    type: primary
    position: below-navbar

format:
  typst:
    number-sections: true
    number-depth: 3
    toc: true
    toc-depth: 2
    margin: {left: 2cm, right: 2cm, top: 2.5cm, bottom: 2.5cm}
    text: PDF
    icon: file-pdf
  docx: default

teaching:
  show-solutions: true
  default-solution-title: "Svar"
