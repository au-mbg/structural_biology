# Complete instructor site. HTML is encrypted only in the publication workflow.
project:
  output-dir: _site/instructor

website:
  navbar:
    right:
      - href: ../index.html
        text: Go to student version
        icon: book
      - href: ../solution/index.html
        text: Go to solution version
        icon: book-fill

  announcement:
    icon: lock-fill
    dismissable: false
    content: "You are viewing the complete instructor version of the course notes. All content and solutions are available."
    type: warning
    position: below-navbar

format:
  typst:
    number-sections: true
    number-depth: 3
    toc: true
    toc-depth: 2
    margin: {left: 2cm, right: 2cm, top: 2.5cm, bottom: 2.5cm}
    text: PDF
    icon: file-pdf
  docx: default

teaching:
  show-solutions: true
  default-solution-title: "Svar"
